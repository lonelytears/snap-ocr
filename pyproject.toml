[project]
name = "snap-ocr"
version = "1.1.0"
description = "截图取字托盘工具：系统截图交互 → 本地 OCR 服务识别 → 置顶浮窗取词"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",   # 托盘/浮窗/未来的 QGraphicsScene 标注体系
    "httpx>=0.27",               # 调 OCR 服务
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pynput>=1.7",               # 全局热键(M2 启用, 需辅助功能权限)
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-servicemanagement>=12.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
snap-ocr = "app.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
